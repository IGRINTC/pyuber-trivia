<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamilton Trivia</title>
<style>
  :root {
    --bg: #1a1208;
    --card: #2a1d0f;
    --accent: #d4af37;
    --accent2: #b91c1c;
    --correct: #22c55e;
    --wrong: #ef4444;
    --text: #f5ead0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1208, #3b1f14);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: var(--text);
  }
  .quiz-container {
    background: var(--card);
    width: 90%;
    max-width: 560px;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    border: 1px solid rgba(212, 175, 55, 0.3);
  }
  h1 {
    text-align: center;
    margin-top: 0;
    font-size: 1.7rem;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  .subtitle {
    text-align: center;
    color: #c9a86a;
    margin-top: -8px;
    margin-bottom: 20px;
    font-size: 0.9rem;
    font-style: italic;
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    margin-bottom: 16px;
    color: #c9a86a;
  }
  .progress-bar {
    height: 8px;
    background: #3b2a17;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s ease;
  }
  .question {
    font-size: 1.25rem;
    margin-bottom: 20px;
    min-height: 60px;
  }
  .options {
    display: grid;
    gap: 12px;
  }
  .option-btn {
    padding: 14px 16px;
    border-radius: 10px;
    border: 2px solid #4a371f;
    background: #1a1208;
    color: var(--text);
    font-size: 1rem;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
  }
  .option-btn.correct {
    border-color: var(--correct);
    background: rgba(34, 197, 94, 0.15);
  }
  .option-btn.wrong {
    border-color: var(--wrong);
    background: rgba(239, 68, 68, 0.15);
  }
  .option-btn:disabled {
    cursor: default;
    opacity: 0.85;
  }
  .footer {
    margin-top: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .next-btn, .restart-btn {
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #1a1208;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .next-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .hidden { display: none; }
  .result-screen {
    text-align: center;
  }
  .result-score {
    font-size: 2.5rem;
    color: var(--accent);
    margin: 12px 0;
  }
  .result-msg {
    color: #c9a86a;
    margin-bottom: 24px;
  }
</style>
</head>
<body>
  <div class="quiz-container">
    <h1>🎭 Hamilton Trivia</h1>
    <div class="subtitle">"Who Lives, Who Dies, Who Tells Your Story"</div>

    <div id="quiz-screen">
      <div class="status-bar">
        <span id="question-counter">Question 1 / 10</span>
        <span id="score-display">Score: 0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="question" id="question-text"></div>
      <div class="options" id="options-container"></div>
      <div class="footer">
        <button class="restart-btn" id="quit-btn" title="Restart quiz">Restart</button>
        <button class="next-btn" id="next-btn" disabled>Next</button>
      </div>
    </div>

    <div id="result-screen" class="result-screen hidden">
      <div class="question" id="result-title">Quiz Complete!</div>
      <div class="result-score" id="final-score"></div>
      <div class="result-msg" id="final-message"></div>
      <button class="restart-btn" id="play-again-btn">Play Again</button>
    </div>
  </div>

<script>
const QUESTION_POOL = [
  { q: "Who wrote the music and lyrics for Hamilton?", options: ["Stephen Sondheim", "Lin-Manuel Miranda", "Andrew Lloyd Webber", "Jonathan Larson"], answer: 1 },
  { q: "What book inspired Lin-Manuel Miranda to write Hamilton?", options: ["1776", "Alexander Hamilton by Ron Chernow", "The Federalist Papers", "Founding Brothers"], answer: 1 },
  { q: "Who is the narrator of the opening number 'Alexander Hamilton'?", options: ["George Washington", "Eliza Hamilton", "Aaron Burr", "Angelica Schuyler"], answer: 2 },
  { q: "What is the name of Alexander Hamilton's wife?", options: ["Angelica Schuyler", "Peggy Schuyler", "Eliza Schuyler", "Maria Reynolds"], answer: 2 },
  { q: "Who kills Hamilton in a duel?", options: ["George Washington", "Aaron Burr", "Thomas Jefferson", "Charles Lee"], answer: 1 },
  { q: "Which Schuyler sister does Hamilton first meet and become infatuated with?", options: ["Peggy", "Eliza", "Angelica", "Maria"], answer: 2 },
  { q: "What position does Hamilton hold in George Washington's cabinet?", options: ["Secretary of State", "Secretary of War", "Secretary of the Treasury", "Attorney General"], answer: 2 },
  { q: "What is the title of the song where Jefferson, Madison, and Hamilton debate the National Bank?", options: ["The Room Where It Happens", "Cabinet Battle #1", "Non-Stop", "The Reynolds Pamphlet"], answer: 1 },
  { q: "Who is the woman Hamilton has an affair with, leading to a scandal?", options: ["Maria Reynolds", "Peggy Schuyler", "Theodosia Burr", "Martha Washington"], answer: 0 },
  { q: "What does Hamilton publish to defend himself against accusations of financial wrongdoing, which reveals his affair?", options: ["The Federalist Papers", "The Reynolds Pamphlet", "Common Sense", "The Farewell Address"], answer: 1 },
  { q: "Who dies in a duel before Hamilton, using the same pistols and same dueling ground?", options: ["Aaron Burr", "Philip Hamilton", "John Laurens", "Hercules Mulligan"], answer: 1 },
  { q: "What nickname is given to Hamilton for his rapid, prolific writing?", options: ["The Ten-Dollar Founding Father", "Non-Stop", "The Fatal Draft", "Young, Scrappy, and Hungry"], answer: 0 },
  { q: "What is the name of Hamilton and Eliza's first son?", options: ["Philip", "Alexander Jr.", "James", "William"], answer: 0 },
  { q: "In the song 'The Room Where It Happens,' who is expressing his frustration at being excluded from key decisions?", options: ["Thomas Jefferson", "Aaron Burr", "James Madison", "George Washington"], answer: 1 },
  { q: "Who narrates and closes the musical with the song 'Who Lives, Who Dies, Who Tells Your Story'?", options: ["Aaron Burr", "Angelica Schuyler", "Eliza Hamilton", "George Washington"], answer: 2 },
  { q: "What country does the Marquis de Lafayette come from?", options: ["Spain", "France", "Prussia", "England"], answer: 1 },
  { q: "What position does George Washington famously give up, surprising many at the time?", options: ["Secretary of the Treasury", "The Presidency", "Commander of the Continental Army after two terms", "Chief Justice"], answer: 2 },
  { q: "Which song features Hamilton, Laurens, Lafayette, and Mulligan introducing themselves before the Revolution?", options: ["My Shot", "Non-Stop", "The Story of Tonight", "Yorktown"], answer: 0 },
  { q: "What king appears throughout the musical with satirical songs about the American colonies leaving Britain?", options: ["King Louis XVI", "King George III", "King Charles III", "King Frederick"], answer: 1 },
  { q: "What is Aaron Burr's famous personal motto/song about withholding his opinions?", options: ["Wait for It", "Non-Stop", "The Room Where It Happens", "Dear Theodosia"], answer: 0 }
];

const TOTAL_QUESTIONS = 10;

let questions = [];
let currentIndex = 0;
let score = 0;
let answered = false;

const questionCounterEl = document.getElementById('question-counter');
const scoreDisplayEl = document.getElementById('score-display');
const progressFillEl = document.getElementById('progress-fill');
const questionTextEl = document.getElementById('question-text');
const optionsContainerEl = document.getElementById('options-container');
const nextBtn = document.getElementById('next-btn');
const quitBtn = document.getElementById('quit-btn');
const quizScreen = document.getElementById('quiz-screen');
const resultScreen = document.getElementById('result-screen');
const finalScoreEl = document.getElementById('final-score');
const finalMessageEl = document.getElementById('final-message');
const playAgainBtn = document.getElementById('play-again-btn');

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startQuiz() {
  questions = shuffle(QUESTION_POOL).slice(0, TOTAL_QUESTIONS);
  currentIndex = 0;
  score = 0;
  quizScreen.classList.remove('hidden');
  resultScreen.classList.add('hidden');
  showQuestion();
}

function showQuestion() {
  answered = false;
  nextBtn.disabled = true;
  const current = questions[currentIndex];
  questionCounterEl.textContent = `Question ${currentIndex + 1} / ${questions.length}`;
  scoreDisplayEl.textContent = `Score: ${score}`;
  progressFillEl.style.width = `${(currentIndex / questions.length) * 100}%`;
  questionTextEl.textContent = current.q;
  optionsContainerEl.innerHTML = '';

  current.options.forEach((optionText, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = optionText;
    btn.addEventListener('click', () => selectAnswer(idx));
    optionsContainerEl.appendChild(btn);
  });
}

function selectAnswer(selectedIdx) {
  if (answered) return;
  answered = true;
  const current = questions[currentIndex];
  const buttons = optionsContainerEl.querySelectorAll('.option-btn');

  buttons.forEach((btn, idx) => {
    btn.disabled = true;
    if (idx === current.answer) {
      btn.classList.add('correct');
    } else if (idx === selectedIdx) {
      btn.classList.add('wrong');
    }
  });

  if (selectedIdx === current.answer) {
    score++;
    scoreDisplayEl.textContent = `Score: ${score}`;
  }
  nextBtn.disabled = false;
}

function goNext() {
  if (!answered) return;
  currentIndex++;
  if (currentIndex >= questions.length) {
    showResult();
  } else {
    showQuestion();
  }
}

function showResult() {
  progressFillEl.style.width = '100%';
  quizScreen.classList.add('hidden');
  resultScreen.classList.remove('hidden');
  finalScoreEl.textContent = `${score} / ${questions.length}`;

  const pct = score / questions.length;
  let message;
  if (pct === 1) message = "Non-stop! You know every word. You're the ten-dollar founding father of Hamilton trivia! 🎩";
  else if (pct >= 0.8) message = "Impressive! You're not throwing away your shot at Hamilton knowledge. 🗽";
  else if (pct >= 0.5) message = "Not bad — but there's more to the story. Give it another listen!";
  else message = "Talk less, study more! Time for a Hamilton rewatch. 🎶";
  finalMessageEl.textContent = message;
}

nextBtn.addEventListener('click', goNext);
quitBtn.addEventListener('click', startQuiz);
playAgainBtn.addEventListener('click', startQuiz);

startQuiz();
</script>
</body>
</html>
