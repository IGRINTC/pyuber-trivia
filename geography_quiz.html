<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geography Quiz</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --correct: #22c55e;
    --wrong: #ef4444;
    --text: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: var(--text);
  }
  .quiz-container {
    background: var(--card);
    width: 90%;
    max-width: 560px;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }
  h1 {
    text-align: center;
    margin-top: 0;
    font-size: 1.6rem;
    color: var(--accent);
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    margin-bottom: 16px;
    color: #94a3b8;
  }
  .progress-bar {
    height: 8px;
    background: #334155;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s ease;
  }
  .question {
    font-size: 1.25rem;
    margin-bottom: 20px;
    min-height: 60px;
  }
  .options {
    display: grid;
    gap: 12px;
  }
  .option-btn {
    padding: 14px 16px;
    border-radius: 10px;
    border: 2px solid #334155;
    background: #0f172a;
    color: var(--text);
    font-size: 1rem;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
  }
  .option-btn.correct {
    border-color: var(--correct);
    background: rgba(34, 197, 94, 0.15);
  }
  .option-btn.wrong {
    border-color: var(--wrong);
    background: rgba(239, 68, 68, 0.15);
  }
  .option-btn:disabled {
    cursor: default;
    opacity: 0.85;
  }
  .footer {
    margin-top: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .next-btn, .restart-btn {
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #0f172a;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .next-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .hidden { display: none; }
  .result-screen {
    text-align: center;
  }
  .result-score {
    font-size: 2.5rem;
    color: var(--accent);
    margin: 12px 0;
  }
  .result-msg {
    color: #94a3b8;
    margin-bottom: 24px;
  }
</style>
</head>
<body>
  <div class="quiz-container">
    <h1>🌍 Geography Quiz</h1>

    <div id="quiz-screen">
      <div class="status-bar">
        <span id="question-counter">Question 1 / 10</span>
        <span id="score-display">Score: 0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="question" id="question-text"></div>
      <div class="options" id="options-container"></div>
      <div class="footer">
        <button class="restart-btn" id="quit-btn" title="Restart quiz">Restart</button>
        <button class="next-btn" id="next-btn" disabled>Next</button>
      </div>
    </div>

    <div id="result-screen" class="result-screen hidden">
      <div class="question" id="result-title">Quiz Complete!</div>
      <div class="result-score" id="final-score"></div>
      <div class="result-msg" id="final-message"></div>
      <button class="restart-btn" id="play-again-btn">Play Again</button>
    </div>
  </div>

<script>
const QUESTION_POOL = [
  { q: "What is the capital of Australia?", options: ["Sydney", "Melbourne", "Canberra", "Perth"], answer: 2 },
  { q: "Which is the longest river in the world?", options: ["Amazon", "Nile", "Yangtze", "Mississippi"], answer: 1 },
  { q: "Which country has the largest population?", options: ["USA", "Indonesia", "India", "China"], answer: 2 },
  { q: "Mount Kilimanjaro is located in which country?", options: ["Kenya", "Tanzania", "Uganda", "Ethiopia"], answer: 1 },
  { q: "Which desert is the largest in the world?", options: ["Sahara", "Gobi", "Antarctic", "Arabian"], answer: 2 },
  { q: "What is the smallest country in the world?", options: ["Monaco", "San Marino", "Vatican City", "Liechtenstein"], answer: 2 },
  { q: "Which continent is the Sahara Desert located on?", options: ["Asia", "Africa", "Australia", "South America"], answer: 1 },
  { q: "The Great Barrier Reef is located near which country?", options: ["Brazil", "Australia", "Indonesia", "South Africa"], answer: 1 },
  { q: "Which country has the most time zones?", options: ["Russia", "USA", "France", "China"], answer: 2 },
  { q: "What is the capital of Canada?", options: ["Toronto", "Vancouver", "Ottawa", "Montreal"], answer: 2 },
  { q: "Which sea is the saltiest body of water in the world?", options: ["Red Sea", "Dead Sea", "Caspian Sea", "Black Sea"], answer: 1 },
  { q: "Mount Everest is located on the border of which two countries?", options: ["China and India", "Nepal and China", "Nepal and India", "Bhutan and China"], answer: 1 },
  { q: "Which country is known as the Land of the Rising Sun?", options: ["China", "South Korea", "Japan", "Thailand"], answer: 2 },
  { q: "What is the largest ocean on Earth?", options: ["Atlantic", "Indian", "Arctic", "Pacific"], answer: 3 },
  { q: "Which African country was formerly known as Abyssinia?", options: ["Egypt", "Ethiopia", "Sudan", "Kenya"], answer: 1 },
  { q: "The Amazon Rainforest is primarily located in which country?", options: ["Peru", "Colombia", "Brazil", "Venezuela"], answer: 2 },
  { q: "Which country has the most natural lakes?", options: ["Russia", "USA", "Canada", "Finland"], answer: 2 },
  { q: "What is the capital of South Korea?", options: ["Busan", "Seoul", "Incheon", "Daegu"], answer: 1 },
  { q: "Which strait separates Europe and Africa?", options: ["Strait of Gibraltar", "Bering Strait", "Strait of Malacca", "Bosphorus Strait"], answer: 0 },
  { q: "Which is the highest active volcano in the world?", options: ["Mount Etna", "Ojos del Salado", "Mount Fuji", "Cotopaxi"], answer: 1 }
];

const TOTAL_QUESTIONS = 10;

let questions = [];
let currentIndex = 0;
let score = 0;
let answered = false;

const questionCounterEl = document.getElementById('question-counter');
const scoreDisplayEl = document.getElementById('score-display');
const progressFillEl = document.getElementById('progress-fill');
const questionTextEl = document.getElementById('question-text');
const optionsContainerEl = document.getElementById('options-container');
const nextBtn = document.getElementById('next-btn');
const quitBtn = document.getElementById('quit-btn');
const quizScreen = document.getElementById('quiz-screen');
const resultScreen = document.getElementById('result-screen');
const finalScoreEl = document.getElementById('final-score');
const finalMessageEl = document.getElementById('final-message');
const playAgainBtn = document.getElementById('play-again-btn');

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startQuiz() {
  questions = shuffle(QUESTION_POOL).slice(0, TOTAL_QUESTIONS);
  currentIndex = 0;
  score = 0;
  quizScreen.classList.remove('hidden');
  resultScreen.classList.add('hidden');
  showQuestion();
}

function showQuestion() {
  answered = false;
  nextBtn.disabled = true;
  const current = questions[currentIndex];
  questionCounterEl.textContent = `Question ${currentIndex + 1} / ${questions.length}`;
  scoreDisplayEl.textContent = `Score: ${score}`;
  progressFillEl.style.width = `${(currentIndex / questions.length) * 100}%`;
  questionTextEl.textContent = current.q;
  optionsContainerEl.innerHTML = '';

  current.options.forEach((optionText, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = optionText;
    btn.addEventListener('click', () => selectAnswer(idx));
    optionsContainerEl.appendChild(btn);
  });
}

function selectAnswer(selectedIdx) {
  if (answered) return;
  answered = true;
  const current = questions[currentIndex];
  const buttons = optionsContainerEl.querySelectorAll('.option-btn');

  buttons.forEach((btn, idx) => {
    btn.disabled = true;
    if (idx === current.answer) {
      btn.classList.add('correct');
    } else if (idx === selectedIdx) {
      btn.classList.add('wrong');
    }
  });

  if (selectedIdx === current.answer) {
    score++;
    scoreDisplayEl.textContent = `Score: ${score}`;
  }
  nextBtn.disabled = false;
}

function goNext() {
  if (!answered) return;
  currentIndex++;
  if (currentIndex >= questions.length) {
    showResult();
  } else {
    showQuestion();
  }
}

function showResult() {
  progressFillEl.style.width = '100%';
  quizScreen.classList.add('hidden');
  resultScreen.classList.remove('hidden');
  finalScoreEl.textContent = `${score} / ${questions.length}`;

  const pct = score / questions.length;
  let message;
  if (pct === 1) message = "Perfect score! You're a geography master! 🌎";
  else if (pct >= 0.8) message = "Excellent work! Your geography knowledge is impressive. 🗺️";
  else if (pct >= 0.5) message = "Good job! A bit more studying and you'll be an expert.";
  else message = "Keep exploring the world — practice makes perfect!";
  finalMessageEl.textContent = message;
}

nextBtn.addEventListener('click', goNext);
quitBtn.addEventListener('click', startQuiz);
playAgainBtn.addEventListener('click', startQuiz);

startQuiz();
</script>
</body>
</html>
